# Xorg für ClokeOS: wie PureDarwins /etc/X11/xorg.conf, dazu Tastatur und Maus am PS/2-Controller
# (ClokePS2, kext/ClokePS2): die eingebaute Tastatur und das Touchpad von Notebooks. puredarwininput
# liest beide Arten im selben Format; ein Gerät, das es nicht gibt, lässt Xorg mit einer Meldung aus.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU"     "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"   "true"
    Option "AllowEmptyInput" "true"
EndSection

Section "Device"
    Identifier "GOP0"
    Driver     "puredarwingop"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "GOP0"
    Monitor    "Monitor0"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "puredarwininput"
    Option     "PDType" "mouse"
    Option     "Device" "/dev/usb_hid_mouse"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "puredarwininput"
    Option     "PDType" "keyboard"
    Option     "Device" "/dev/usb_hid_kbd"
EndSection

Section "InputDevice"
    Identifier "Mouse1"
    Driver     "puredarwininput"
    Option     "PDType" "mouse"
    Option     "Device" "/dev/clokeos_mouse"
EndSection

Section "InputDevice"
    Identifier "Keyboard1"
    Driver     "puredarwininput"
    Option     "PDType" "keyboard"
    Option     "Device" "/dev/clokeos_kbd"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen     "Screen0"
    InputDevice "Mouse0" "CorePointer"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse1" "SendCoreEvents"
    InputDevice "Keyboard1" "SendCoreEvents"
EndSection
