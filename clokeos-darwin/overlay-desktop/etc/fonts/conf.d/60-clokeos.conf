<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ClokeOS: Cloke Sans (/Library/Fonts/ClokeSans) ist die Standardschrift für sans-serif und für
     Programme, die "Sans" oder DejaVu Sans verlangen; Festbreite bleibt DejaVu Sans Mono. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Cloke Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Sans</family>
    <prefer><family>Cloke Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Cloke Sans</family></prefer>
  </alias>
</fontconfig>
